apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-task-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-task-app

  template:
    metadata:
      labels:
        app: devops-task-app

    spec:
      containers:

        - name: devops-task-app
          image: umamaheswaris/devops-task-app:latest

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
